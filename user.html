<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Photobooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
        .page-step { transition: opacity 0.5s ease-in-out; }
        .selection-card { transition: transform 0.2s, box-shadow 0.2s; }
        .selection-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .frame-card.selected { box-shadow: 0 0 0 4px #4f46e5; transform: scale(1.05); }
        .loader { border-top-color: #4f46e5; }
        .action-buttons button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .photobooth-container { aspect-ratio: 4 / 3; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="photobooth-main-container bg-white rounded-2xl shadow-xl w-full max-w-4xl mx-auto">

        <!-- Langkah 1: Pilih Jumlah Foto -->
        <div id="page-step-1-count" class="page-step p-6 md:p-12">
            <header class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">Langkah 1: Pilih Jumlah Foto</h1>
                <p class="text-gray-500 mt-2 text-base md:text-lg">Pilih berapa banyak foto yang ingin Anda ambil.</p>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="selection-card cursor-pointer bg-gray-50 p-4 rounded-lg border-2 border-transparent hover:border-indigo-500" data-count="1">
                    <div class="h-40 flex items-center justify-center bg-gray-200 rounded-md mb-4"><div class="w-24 h-32 bg-gray-400 rounded"></div></div>
                    <h3 class="text-xl font-bold text-center">1 Foto</h3>
                </div>
                <div class="selection-card cursor-pointer bg-gray-50 p-4 rounded-lg border-2 border-transparent hover:border-indigo-500" data-count="3">
                    <div class="h-40 flex flex-col items-center justify-around bg-gray-200 rounded-md mb-4 p-2 space-y-1">
                        <div class="w-20 h-10 bg-gray-400 rounded"></div><div class="w-20 h-10 bg-gray-400 rounded"></div><div class="w-20 h-10 bg-gray-400 rounded"></div>
                    </div>
                    <h3 class="text-xl font-bold text-center">3 Foto</h3>
                </div>
                <div class="selection-card cursor-pointer bg-gray-50 p-4 rounded-lg border-2 border-transparent hover:border-indigo-500" data-count="6">
                    <div class="h-40 grid grid-cols-2 grid-rows-3 gap-1 bg-gray-200 rounded-md mb-4 p-2">
                        <div class="bg-gray-400 rounded"></div><div class="bg-gray-400 rounded"></div><div class="bg-gray-400 rounded"></div><div class="bg-gray-400 rounded"></div><div class="bg-gray-400 rounded"></div><div class="bg-gray-400 rounded"></div>
                    </div>
                    <h3 class="text-xl font-bold text-center">6 Foto</h3>
                </div>
            </div>
        </div>

        <!-- Langkah 2: Pilih Desain Bingkai -->
        <div id="page-step-2-frame" class="page-step hidden p-6 md:p-12">
            <header class="text-center mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">Langkah 2: Pilih Bingkai</h1>
                <p class="text-gray-500 mt-2">Pilih bingkai untuk sesi <span id="frame-photo-count" class="font-bold"></span> foto Anda.</p>
            </header>
            <div id="frame-selection-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 min-h-[200px]"></div>
            <div class="flex flex-col sm:flex-row justify-between mt-8 gap-4">
                <button id="back-to-step-1" class="w-full sm:w-auto bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-lg hover:bg-gray-300">Kembali</button>
                <button id="go-to-step-3" class="w-full sm:w-auto bg-indigo-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-indigo-700" disabled>Lanjutkan</button>
            </div>
        </div>

        <!-- Langkah 3: Sesi Pemotretan -->
        <div id="page-step-3-camera" class="page-step hidden p-4 md:p-12">
            <div class="photobooth-wrapper">
                <div class="photobooth-container relative w-full bg-gray-900 rounded-xl overflow-hidden mb-4 border-4 border-gray-200">
                    <video id="video" autoplay playsinline class="w-full h-full object-cover" style="transform: scaleX(-1);"></video>
                    <div id="countdown" class="absolute inset-0 flex items-center justify-center text-8xl md:text-9xl font-bold text-white bg-black bg-opacity-50 pointer-events-none opacity-0 transition-opacity"></div>
                    <canvas id="collage-canvas" class="w-full h-full object-contain hidden"></canvas>
                    <img id="gif-preview" class="w-full h-full object-contain hidden" />
                </div>
                <div id="preview-gallery" class="flex justify-start items-center gap-2 mb-6 min-h-[80px] bg-gray-100 p-2 rounded-lg overflow-x-auto"></div>
                <!-- PERBAIKAN: Tata letak tombol dirombak total untuk mobile -->
                <div class="action-buttons space-y-3 sm:space-y-0 sm:flex sm:flex-wrap sm:justify-center sm:gap-3">
                    <button id="back-to-step-2" class="w-full sm:w-auto bg-gray-200 text-gray-800 font-bold py-3 px-6 rounded-lg">Kembali</button>
                    <button id="start-btn" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-3 px-6 rounded-lg">Mulai Sesi Foto</button>
                    <button id="gif-btn" class="w-full sm:w-auto bg-purple-600 text-white font-bold py-3 px-6 rounded-lg hidden">Buat GIF</button>
                    <button id="download-btn" class="w-full sm:w-auto bg-green-600 text-white font-bold py-3 px-6 rounded-lg hidden">Unduh Kolase</button>
                    <button id="download-gif-btn" class="w-full sm:w-auto bg-green-600 text-white font-bold py-3 px-6 rounded-lg hidden">Unduh GIF</button>
                    <button id="reset-btn" class="w-full sm:w-auto bg-gray-500 text-white font-bold py-3 px-6 rounded-lg hidden">Ulangi</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        window.addEventListener('load', () => {
            const SUPABASE_URL = 'https://ldatbtyooiwyujsddpcw.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkYXRidHlvb2l3eXVqc2RkcGN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIyMzA1MzcsImV4cCI6MjA2NzgwNjUzN30.Ky4Ovzu1HCLev7_mMnKXSa5Qw80bFFiIIqhRtCKIQ44';
            const { createClient } = supabase;
            const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            let stream;
            let capturedPhotos = [];
            let selectedPhotoCount = 0;
            let selectedFrame = { url: 'none', layout: 'none' };
            let generatedGifBlob = null;
            let gifWorkerUrl = null;

            const pages = document.querySelectorAll('.page-step');
            const countSelectionCards = document.querySelectorAll('#page-step-1-count .selection-card');
            const frameSelectionGrid = document.getElementById('frame-selection-grid');
            const framePhotoCountSpan = document.getElementById('frame-photo-count');
            const backToStep1Btn = document.getElementById('back-to-step-1');
            const goToStep3Btn = document.getElementById('go-to-step-3');
            const backToStep2Btn = document.getElementById('back-to-step-2');
            const video = document.getElementById('video');
            const cameraContainer = document.querySelector('.photobooth-container');
            const startBtn = document.getElementById('start-btn');
            const countdownOverlay = document.getElementById('countdown');
            const previewGallery = document.getElementById('preview-gallery');
            const collageCanvas = document.getElementById('collage-canvas');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const gifBtn = document.getElementById('gif-btn');
            const gifPreview = document.getElementById('gif-preview');
            const downloadGifBtn = document.getElementById('download-gif-btn');

            async function prepareGifWorker() {
                try {
                    const response = await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js');
                    const workerScriptContent = await response.text();
                    const blob = new Blob([workerScriptContent], { type: 'application/javascript' });
                    gifWorkerUrl = URL.createObjectURL(blob);
                } catch (error) {
                    console.error('Gagal mempersiapkan GIF worker:', error);
                    gifBtn.style.display = 'none'; 
                }
            }

            function showPage(pageId) { pages.forEach(page => page.classList.toggle('hidden', page.id !== pageId)); }

            async function loadFrames(count) {
                frameSelectionGrid.innerHTML = `<div class="col-span-full flex justify-center items-center"><div class="loader animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-gray-900"></div></div>`;
                goToStep3Btn.disabled = true;
                const { data, error } = await supabaseClient.from('frames').select('*').eq('photo_count', count);
                if (error) { console.error('Gagal memuat bingkai:', error); frameSelectionGrid.innerHTML = `<p class="col-span-full text-red-500">Gagal memuat bingkai.</p>`; return; }
                frameSelectionGrid.innerHTML = '';
                const noFrame = document.createElement('div');
                noFrame.className = 'frame-card cursor-pointer p-2 border-2 rounded-lg bg-gray-200 flex items-center justify-center';
                noFrame.innerHTML = `<p class="font-bold">Polos</p>`;
                noFrame.dataset.frameUrl = 'none';
                noFrame.dataset.layoutType = count === 1 ? 'single' : (count === 3 ? 'strip' : 'grid-2x3');
                frameSelectionGrid.appendChild(noFrame);
                data.forEach(frame => {
                    const frameEl = document.createElement('div');
                    frameEl.className = 'frame-card cursor-pointer p-2 border-2 rounded-lg';
                    frameEl.innerHTML = `<img src="${frame.image_url}" class="w-full h-full object-contain rounded-md"><p class="text-xs mt-1 text-center font-semibold">${frame.name}</p>`;
                    frameEl.dataset.frameUrl = frame.image_url;
                    frameEl.dataset.layoutType = frame.layout_type;
                    frameSelectionGrid.appendChild(frameEl);
                });
            }

            async function initCamera() {
                startBtn.disabled = true; startBtn.textContent = "Membuka Kamera...";
                try {
                    const constraints = {
                        video: { 
                            facingMode: 'user',
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }, 
                        audio: false 
                    };
                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        startBtn.disabled = false;
                        startBtn.textContent = "Mulai Sesi Foto";
                    };
                } catch (err) { console.error("Error accessing camera: ", err); startBtn.textContent = "Kamera Gagal"; }
            }

            function stopCamera() { if (stream) { stream.getTracks().forEach(track => track.stop()); } }
            
            async function startPhotobooth() {
                startBtn.classList.add('hidden'); backToStep2Btn.classList.add('hidden'); resetBtn.classList.add('hidden'); downloadBtn.classList.add('hidden'); gifBtn.classList.add('hidden');
                previewGallery.innerHTML = ''; capturedPhotos = [];
                for (let i = 0; i < selectedPhotoCount; i++) {
                    await runCountdown(3);
                    takePhoto();
                    if (i < selectedPhotoCount - 1) { await new Promise(resolve => setTimeout(resolve, 800)); }
                }
                await createCollage();
                showResultState();
            }

            function runCountdown(seconds) { return new Promise(resolve => { countdownOverlay.style.opacity = '1'; let count = seconds; const interval = setInterval(() => { countdownOverlay.textContent = count; count--; if (count < 0) { clearInterval(interval); countdownOverlay.style.opacity = '0'; resolve(); } }, 1000); }); }
            
            // --- PERBAIKAN: Fungsi takePhoto diubah untuk memastikan rasio 4:3 ---
            function takePhoto() {
                const targetAspectRatio = 4 / 3;
                const tempCanvas = document.createElement('canvas');
                const context = tempCanvas.getContext('2d');

                tempCanvas.width = 1280;
                tempCanvas.height = 960; // 1280 / (4/3)

                const videoRatio = video.videoWidth / video.videoHeight;
                let sx, sy, sWidth, sHeight;

                if (videoRatio > targetAspectRatio) {
                    sHeight = video.videoHeight;
                    sWidth = sHeight * targetAspectRatio;
                    sx = (video.videoWidth - sWidth) / 2;
                    sy = 0;
                } else {
                    sWidth = video.videoWidth;
                    sHeight = sWidth / targetAspectRatio;
                    sx = 0;
                    sy = (video.videoHeight - sHeight) / 2;
                }

                context.translate(tempCanvas.width, 0);
                context.scale(-1, 1);
                context.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, tempCanvas.width, tempCanvas.height);
                
                const photoDataUrl = tempCanvas.toDataURL('image/jpeg');
                capturedPhotos.push(photoDataUrl);
                addPhotoToPreview(photoDataUrl);
            }

            function addPhotoToPreview(dataUrl) { const img = document.createElement('img'); img.src = dataUrl; img.className = 'preview-thumbnail h-16 w-auto rounded-md border-2 border-white shadow-md object-cover'; previewGallery.appendChild(img); }
            function downloadCollage() { const link = document.createElement('a'); link.download = `photobooth-hasil-${Date.now()}.jpg`; link.href = collageCanvas.toDataURL('image/jpeg', 0.9); link.click(); }
            
            async function createCollage() {
                if (capturedPhotos.length === 0) return;
                const layout = selectedFrame.layout;
                const ctx = collageCanvas.getContext('2d');
                const PADDING = 40; const BOTTOM_MARGIN = 100; 
                const loadedImages = await Promise.all(capturedPhotos.map(dataUrl => new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.src = dataUrl; })));
                const firstImage = loadedImages[0];
                const cameraAspectRatio = firstImage.width / firstImage.height;
                let canvasWidth, canvasHeight;
                switch(layout) {
                    case 'single':
                        const singlePhotoWidth = 800; const singlePhotoHeight = singlePhotoWidth / cameraAspectRatio;
                        canvasWidth = singlePhotoWidth + PADDING * 2; canvasHeight = singlePhotoHeight + PADDING * 2 + BOTTOM_MARGIN;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        ctx.drawImage(firstImage, PADDING, PADDING, singlePhotoWidth, singlePhotoHeight);
                        break;
                    case 'strip':
                        const stripCellWidth = 600; const stripCellHeight = stripCellWidth / cameraAspectRatio; const numPhotosStrip = Math.min(loadedImages.length, 3);
                        canvasWidth = stripCellWidth + PADDING * 2; canvasHeight = (stripCellHeight * numPhotosStrip) + (PADDING * (numPhotosStrip + 1)) + BOTTOM_MARGIN;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        loadedImages.slice(0, 3).forEach((img, i) => ctx.drawImage(img, PADDING, PADDING + i * (stripCellHeight + PADDING), stripCellWidth, stripCellHeight));
                        break;
                    case 'grid-2x3':
                        const gridCellWidth = 600; const gridCellHeight = gridCellWidth / cameraAspectRatio;
                        canvasWidth = (gridCellWidth * 2) + (PADDING * 3); canvasHeight = (gridCellHeight * 3) + (PADDING * 4) + BOTTOM_MARGIN;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        loadedImages.slice(0, 6).forEach((img, i) => { const row = Math.floor(i / 2); const col = i % 2; ctx.drawImage(img, PADDING + col * (gridCellWidth + PADDING), PADDING + row * (gridCellHeight + PADDING), gridCellWidth, gridCellHeight); });
                        break;
                }
                if (selectedFrame.url !== 'none') {
                    try {
                        const frameImg = await new Promise((resolve, reject) => { const img = new Image(); img.crossOrigin = "Anonymous"; img.onload = () => resolve(img); img.onerror = reject; img.src = selectedFrame.url; });
                        ctx.drawImage(frameImg, 0, 0, canvasWidth, canvasHeight);
                    } catch (error) { console.error("Gagal memuat bingkai:", error); }
                }
            }
            
            async function createGif() {
                if (!gifWorkerUrl) { alert('Komponen pembuat GIF belum siap.'); return; }
                gifBtn.disabled = true; gifBtn.textContent = "Membuat GIF...";
                let gifFrameUrl = 'none';
                try {
                    const { data, error } = await supabaseClient.from('frames').select('image_url').eq('photo_count', 1).limit(1).single();
                    if (error) throw error;
                    if (data) gifFrameUrl = data.image_url;
                } catch (error) { console.error("Tidak menemukan bingkai 1 foto.", error); }
                const loadedImages = await Promise.all(capturedPhotos.map(dataUrl => new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.src = dataUrl; })));
                const firstImage = loadedImages[0];
                const cameraAspectRatio = firstImage.width / firstImage.height;
                const PADDING = 40; const BOTTOM_MARGIN = 100;
                const singlePhotoWidth = 800; const singlePhotoHeight = singlePhotoWidth / cameraAspectRatio;
                const canvasWidth = singlePhotoWidth + PADDING * 2; const canvasHeight = singlePhotoHeight + PADDING * 2 + BOTTOM_MARGIN;
                const gif = new GIF({ workers: 2, quality: 10, width: canvasWidth, height: canvasHeight, workerScript: gifWorkerUrl });
                let frameImgForGif = null;
                if (gifFrameUrl !== 'none') {
                    try {
                        frameImgForGif = await new Promise((resolve, reject) => { const f_img = new Image(); f_img.crossOrigin = "Anonymous"; f_img.onload = () => resolve(f_img); f_img.onerror = reject; f_img.src = gifFrameUrl; });
                    } catch(e) { console.error("Gagal memuat bingkai untuk GIF", e); }
                }
                for (const img of loadedImages) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = canvasWidth;
                    tempCanvas.height = canvasHeight;
                    const ctx = tempCanvas.getContext('2d');
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                    ctx.drawImage(img, PADDING, PADDING, singlePhotoWidth, singlePhotoHeight);
                    if (frameImgForGif) { ctx.drawImage(frameImgForGif, 0, 0, canvasWidth, canvasHeight); }
                    gif.addFrame(tempCanvas, { delay: 500 });
                }
                gif.on('finished', function(blob) {
                    generatedGifBlob = blob;
                    gifPreview.src = URL.createObjectURL(blob);
                    collageCanvas.classList.add('hidden');
                    gifPreview.classList.remove('hidden');
                    downloadBtn.classList.add('hidden');
                    gifBtn.classList.add('hidden');
                    downloadGifBtn.classList.remove('hidden');
                    gifBtn.disabled = false;
                    gifBtn.textContent = "Buat Versi GIF";
                });
                gif.render();
            }

            function downloadGif() {
                if (!generatedGifBlob) return;
                const link = document.createElement('a');
                link.download = `photobooth-animasi-${Date.now()}.gif`;
                link.href = URL.createObjectURL(generatedGifBlob);
                link.click();
            }

            function showResultState() {
                video.classList.add('hidden');
                collageCanvas.classList.remove('hidden');
                downloadBtn.classList.remove('hidden');
                resetBtn.classList.remove('hidden');
                if (selectedPhotoCount > 1) {
                    gifBtn.classList.remove('hidden');
                }
            }

            function resetToInitialState() {
                capturedPhotos = [];
                generatedGifBlob = null;
                previewGallery.innerHTML = '';
                video.classList.remove('hidden');
                collageCanvas.classList.add('hidden');
                gifPreview.classList.add('hidden');
                downloadBtn.classList.add('hidden');
                downloadGifBtn.classList.add('hidden');
                gifBtn.classList.add('hidden');
                resetBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
                backToStep2Btn.classList.remove('hidden');
                initCamera();
            }

            countSelectionCards.forEach(card => card.addEventListener('click', () => { selectedPhotoCount = parseInt(card.dataset.count, 10); framePhotoCountSpan.textContent = selectedPhotoCount; loadFrames(selectedPhotoCount); showPage('page-step-2-frame'); }));
            frameSelectionGrid.addEventListener('click', (e) => { const selectedCard = e.target.closest('.frame-card'); if (selectedCard) { frameSelectionGrid.querySelectorAll('.frame-card').forEach(card => card.classList.remove('selected')); selectedCard.classList.add('selected'); selectedFrame.url = selectedCard.dataset.frameUrl; selectedFrame.layout = selectedCard.dataset.layoutType; goToStep3Btn.disabled = false; } });
            backToStep1Btn.addEventListener('click', () => showPage('page-step-1-count'));
            goToStep3Btn.addEventListener('click', () => { showPage('page-step-3-camera'); initCamera(); });
            backToStep2Btn.addEventListener('click', () => { stopCamera(); showPage('page-step-2-frame'); });
            startBtn.addEventListener('click', startPhotobooth);
            downloadBtn.addEventListener('click', downloadCollage);
            resetBtn.addEventListener('click', resetToInitialState);
            gifBtn.addEventListener('click', createGif);
            downloadGifBtn.addEventListener('click', downloadGif);

            prepareGifWorker();
            showPage('page-step-1-count');
        });
    </script>
</body>
</html>
