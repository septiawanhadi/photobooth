<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Photobooth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
        @keyframes countdown-zoom { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .countdown-animation { animation: countdown-zoom 0.5s ease-in-out; }
        .preview-thumbnail { animation: fade-in 0.4s ease; }
        @keyframes fade-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .color-option, .frame-option { transition: transform 0.2s; cursor: pointer; }
        .color-option:hover, .frame-option:hover { transform: scale(1.1); }
        .color-option.selected, .frame-option.selected { transform: scale(1.1); box-shadow: 0 0 0 3px #3b82f6; }
        .photobooth-container { aspect-ratio: var(--camera-aspect-ratio, 4 / 3); }
        .gemini-btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="photobooth-wrapper bg-white rounded-2xl shadow-xl p-6 md:p-8 w-full max-w-3xl text-center">
        
        <header class="mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800">Photobooth Digital 📸</h1>
            <p class="text-gray-500 mt-2">Pilih opsimu, berpose, dan unduh hasilnya!</p>
        </header>

        <div class="main-controls grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="space-y-4">
                 <div>
                    <label for="photo-count" class="block text-sm font-medium text-gray-700 mb-1 text-left">Jumlah Foto:</label>
                    <select id="photo-count" class="w-full p-3 border border-gray-300 rounded-lg">
                        <option value="1">1 Foto</option>
                        <option value="3">3 Foto</option>
                        <option value="6">6 Foto</option>
                    </select>
                </div>
                <div>
                    <label for="collage-layout" class="block text-sm font-medium text-gray-700 mb-1 text-left">Desain Kolase:</label>
                    <select id="collage-layout" class="w-full p-3 border border-gray-300 rounded-lg">
                        <option value="single">1 Foto Penuh</option>
                        <option value="strip">Strip Klasik (3 Foto)</option>
                        <option value="grid-2x3">Grid 2x3 (untuk 6 foto)</option>
                    </select>
                </div>
            </div>
            <div class="space-y-4">
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-left">Warna Latar:</label>
                    <div id="color-palette" class="flex flex-wrap gap-2 justify-start">
                        <div class="color-option w-8 h-8 rounded-full border-2 border-gray-300 selected" style="background-color: #FFFFFF;" data-color="#FFFFFF"></div>
                        <div class="color-option w-8 h-8 rounded-full" style="background-color: #000000;" data-color="#000000"></div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2 text-left">Bingkai:</label>
                    <div id="frame-selection" class="flex flex-wrap gap-2 justify-start min-h-[40px]">
                        <div class="text-xs text-gray-500">Memuat bingkai...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4 p-3 bg-blue-50 rounded-lg">
            <button id="pose-suggestion-btn" class="gemini-btn w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-600 transition-all">✨ Beri Ide Pose!</button>
            <p id="pose-suggestion-output" class="text-sm text-gray-700 mt-2 text-center"></p>
        </div>

        <div class="photobooth-container relative w-full bg-gray-900 rounded-xl overflow-hidden mb-4 border-4 border-gray-200">
            <video id="video" autoplay playsinline class="w-full h-full object-cover" style="transform: scaleX(-1);"></video>
            <div id="countdown" class="absolute inset-0 flex items-center justify-center text-9xl font-bold text-white bg-black bg-opacity-50 pointer-events-none opacity-0 transition-opacity"></div>
            <canvas id="collage-canvas" class="w-full h-full object-contain hidden"></canvas>
            <div id="permission-denied-message" class="hidden absolute inset-0 flex flex-col items-center justify-center text-white p-4 text-center">
                <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10 l4.55a2 2 0 01.95 1.7V17a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h7.55a2 2 0 011.05.29L15 6z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 19L5 5"></path></svg>
                <h3 class="text-xl font-bold mb-2">Kamera Tidak Dapat Diakses</h3>
                <p class="text-sm">Silakan izinkan akses kamera di browser Anda untuk memulai.</p>
            </div>
        </div>

        <div id="preview-gallery" class="flex justify-center items-center gap-2 mb-6 min-h-[80px] bg-gray-100 p-2 rounded-lg"></div>

        <div class="action-buttons space-y-3 md:space-y-0 md:space-x-4">
            <button id="start-btn" class="w-full md:w-auto bg-blue-600 text-white font-bold py-3 px-8 rounded-lg">Mulai Sesi Foto</button>
            <button id="title-generation-btn" class="gemini-btn w-full md:w-auto bg-purple-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-purple-700 transition-all hidden">✨ Buat Judul Otomatis</button>
            <button id="download-btn" class="w-full md:w-auto bg-green-600 text-white font-bold py-3 px-8 rounded-lg hidden">Unduh Hasil</button>
            <button id="reset-btn" class="w-full md:w-auto bg-gray-500 text-white font-bold py-3 px-8 rounded-lg hidden">Ulangi</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const SUPABASE_URL = 'https://ldatbtyooiwyujsddpcw.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkYXRidHlvb2l3eXVqc2RkcGN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIyMzA1MzcsImV4cCI6MjA2NzgwNjUzN30.Ky4Ovzu1HCLev7_mMnKXSa5Qw80bFFiIIqhRtCKIQ44';
            const { createClient } = supabase;
            const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const video = document.getElementById('video');
            const countdownOverlay = document.getElementById('countdown');
            const collageCanvas = document.getElementById('collage-canvas');
            const startBtn = document.getElementById('start-btn');
            const downloadBtn = document.getElementById('download-btn');
            const resetBtn = document.getElementById('reset-btn');
            const photoCountSelect = document.getElementById('photo-count');
            const collageLayoutSelect = document.getElementById('collage-layout');
            const previewGallery = document.getElementById('preview-gallery');
            const colorPalette = document.getElementById('color-palette');
            const frameSelection = document.getElementById('frame-selection');
            const cameraContainer = document.querySelector('.photobooth-container');
            const poseSuggestionBtn = document.getElementById('pose-suggestion-btn');
            const poseSuggestionOutput = document.getElementById('pose-suggestion-output');
            const titleGenerationBtn = document.getElementById('title-generation-btn');
            const permissionDeniedMessage = document.getElementById('permission-denied-message');

            let stream;
            let capturedPhotos = [];
            let selectedColor = '#FFFFFF';
            let selectedFrameUrl = null;
            let generatedTitle = "";

            async function callGemini(prompt) {
                const apiKey = "AIzaSyD5bz8PrqdTqKjQ0QLqsBjOotlwP2-CAL8"; 
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
                const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };
                try {
                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) { throw new Error(`HTTP error! status: ${response.status}`); }
                    const result = await response.json();
                    if (result.candidates && result.candidates[0]?.content?.parts?.[0]) {
                        return result.candidates[0].content.parts[0].text.trim();
                    } else { throw new Error("Struktur respons API tidak valid."); }
                } catch (error) { console.error("Gagal memanggil Gemini API:", error); return "Maaf, terjadi kesalahan AI."; }
            }

            async function createCollage() {
                if (capturedPhotos.length === 0) return;
                const layout = collageLayoutSelect.value;
                const ctx = collageCanvas.getContext('2d');
                const PADDING = 40;
                const BOTTOM_MARGIN = 100; 
                const loadedImages = await Promise.all(capturedPhotos.map(dataUrl => new Promise(resolve => { const img = new Image(); img.onload = () => resolve(img); img.src = dataUrl; })));
                const firstImage = loadedImages[0];
                const cameraAspectRatio = firstImage.width / firstImage.height;
                let canvasWidth, canvasHeight;
                switch(layout) {
                    case 'single':
                        canvasWidth = 1200; canvasHeight = canvasWidth / cameraAspectRatio;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = selectedColor; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        ctx.drawImage(firstImage, 0, 0, canvasWidth, canvasHeight);
                        break;
                    case 'strip':
                        const stripCellWidth = 600; const stripCellHeight = stripCellWidth / cameraAspectRatio; const numPhotosStrip = Math.min(loadedImages.length, 3);
                        canvasWidth = stripCellWidth + PADDING * 2; canvasHeight = (stripCellHeight * numPhotosStrip) + (PADDING * (numPhotosStrip + 1)) + BOTTOM_MARGIN;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = selectedColor; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        loadedImages.slice(0, numPhotosStrip).forEach((img, i) => ctx.drawImage(img, PADDING, PADDING + i * (stripCellHeight + PADDING), stripCellWidth, stripCellHeight));
                        break;
                    case 'grid-2x3':
                        const gridCellWidth = 600; const gridCellHeight = gridCellWidth / cameraAspectRatio;
                        canvasWidth = (gridCellWidth * 2) + (PADDING * 3); canvasHeight = (gridCellHeight * 3) + (PADDING * 4) + BOTTOM_MARGIN;
                        collageCanvas.width = canvasWidth; collageCanvas.height = canvasHeight;
                        ctx.fillStyle = selectedColor; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                        loadedImages.slice(0, 6).forEach((img, i) => { const row = Math.floor(i / 2); const col = i % 2; ctx.drawImage(img, PADDING + col * (gridCellWidth + PADDING), PADDING + row * (gridCellHeight + PADDING), gridCellWidth, gridCellHeight); });
                        break;
                }
                if (generatedTitle && layout !== 'single') {
                    ctx.fillStyle = (selectedColor === '#000000') ? 'white' : 'black';
                    ctx.font = 'bold 48px Inter, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const titleY = canvasHeight - (BOTTOM_MARGIN / 2) - PADDING / 2;
                    ctx.fillText(generatedTitle, canvasWidth / 2, titleY);
                }
                await drawFrame(ctx, collageCanvas.width, collageCanvas.height);
            }
            
            async function drawFrame(ctx, width, height) {
                if (selectedFrameUrl === 'none' || !selectedFrameUrl) return;
                try {
                    const frameImg = await new Promise((resolve, reject) => {
                        const img = new Image();
                        img.crossOrigin = "Anonymous";
                        img.onload = () => resolve(img);
                        img.onerror = () => reject(new Error('Gagal memuat gambar bingkai. Ini mungkin karena masalah CORS dari sumber gambar (misalnya Google Drive).'));
                        img.src = selectedFrameUrl;
                    });
                    ctx.drawImage(frameImg, 0, 0, width, height);
                } catch (error) {
                    console.error("Gagal memuat gambar bingkai:", error.message);
                    alert(`Tidak dapat memuat bingkai dari URL yang dipilih karena batasan keamanan browser (CORS).\n\nSolusi: Coba gunakan bingkai yang diunggah langsung ke Supabase Storage melalui halaman admin, bukan dari URL eksternal seperti Google Drive.`);
                }
            }
            
            async function initCamera() {
                permissionDeniedMessage.classList.add('hidden');
                video.classList.remove('hidden');
                startBtn.disabled = true;
                startBtn.textContent = "Membuka Kamera...";
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 1280, height: 720 }, audio: false });
                    video.srcObject = stream;
                    video.onloadedmetadata = () => { const cameraAspectRatio = video.videoWidth / video.videoHeight; cameraContainer.style.setProperty('--camera-aspect-ratio', cameraAspectRatio); };
                    startBtn.disabled = false;
                    startBtn.textContent = "Mulai Sesi Foto";
                } catch (err) {
                    console.error("Error accessing camera: ", err);
                    video.classList.add('hidden');
                    permissionDeniedMessage.classList.remove('hidden');
                    startBtn.disabled = true;
                    startBtn.textContent = "Kamera Tidak Tersedia";
                }
            }

            async function startPhotobooth() { resetToInitialState(true); startBtn.disabled = true; startBtn.textContent = "Bersiap..."; const photoCount = parseInt(photoCountSelect.value, 10); for (let i = 0; i < photoCount; i++) { await runCountdown(3); takePhoto(); if (i < photoCount - 1) { await new Promise(resolve => setTimeout(resolve, 800)); } } await createCollage(); showResultState(); }
            function runCountdown(seconds) { return new Promise(resolve => { countdownOverlay.style.opacity = '1'; let count = seconds; const interval = setInterval(() => { countdownOverlay.textContent = count; countdownOverlay.classList.add('countdown-animation'); setTimeout(() => countdownOverlay.classList.remove('countdown-animation'), 500); count--; if (count < 0) { clearInterval(interval); countdownOverlay.style.opacity = '0'; countdownOverlay.textContent = ''; resolve(); } }, 1000); }); }
            function takePhoto() { const tempCanvas = document.createElement('canvas'); tempCanvas.width = video.videoWidth; tempCanvas.height = video.videoHeight; const context = tempCanvas.getContext('2d'); context.translate(tempCanvas.width, 0); context.scale(-1, 1); context.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height); const photoDataUrl = tempCanvas.toDataURL('image/jpeg'); capturedPhotos.push(photoDataUrl); addPhotoToPreview(photoDataUrl); }
            function addPhotoToPreview(dataUrl) { const img = document.createElement('img'); img.src = dataUrl; img.className = 'preview-thumbnail h-16 w-auto rounded-md border-2 border-white shadow-md object-cover'; previewGallery.appendChild(img); }
            function downloadCollage() { const link = document.createElement('a'); link.download = `photobooth-hasil-${Date.now()}.jpg`; link.href = collageCanvas.toDataURL('image/jpeg', 0.9); link.click(); }
            function resetToInitialState(isStarting = false) { capturedPhotos = []; generatedTitle = ""; previewGallery.innerHTML = ''; video.classList.remove('hidden'); permissionDeniedMessage.classList.add('hidden'); collageCanvas.classList.add('hidden'); downloadBtn.classList.add('hidden'); resetBtn.classList.add('hidden'); titleGenerationBtn.classList.add('hidden'); if (!isStarting) { startBtn.classList.remove('hidden'); initCamera(); } }
            function showResultState() { video.classList.add('hidden'); collageCanvas.classList.remove('hidden'); startBtn.classList.add('hidden'); downloadBtn.classList.remove('hidden'); resetBtn.classList.remove('hidden'); titleGenerationBtn.classList.remove('hidden'); }
            async function loadFrames() { frameSelection.innerHTML = `<div class="text-xs text-gray-500">Memuat bingkai...</div>`; const count = parseInt(photoCountSelect.value, 10); const layout = collageLayoutSelect.value; const { data, error } = await supabaseClient.from('frames').select('*').eq('photo_count', count).eq('layout_type', layout); if (error) { console.error('Gagal memuat bingkai:', error); frameSelection.innerHTML = `<div class="text-xs text-red-500">Gagal memuat bingkai</div>`; return; } frameSelection.innerHTML = ''; const noFrame = document.createElement('div'); noFrame.className = 'frame-option text-xs p-1 h-10 flex items-center justify-center border-2 border-gray-300 rounded-md bg-gray-50 selected'; noFrame.textContent = 'Polos'; noFrame.dataset.frameUrl = 'none'; frameSelection.appendChild(noFrame); selectedFrameUrl = 'none'; if (data.length > 0) { data.forEach(frame => { const frameEl = document.createElement('div'); frameEl.className = 'frame-option text-xs p-1 h-10 flex items-center justify-center border-2 border-gray-300 rounded-md bg-gray-50'; frameEl.textContent = frame.name; frameEl.dataset.frameUrl = frame.image_url; frameSelection.appendChild(frameEl); }); } else { frameSelection.innerHTML += `<div class="text-xs text-gray-400">Tidak ada bingkai untuk opsi ini.</div>`; } }

            // Event Listeners
            colorPalette.addEventListener('click', (e) => { if (e.target.classList.contains('color-option')) { colorPalette.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected')); e.target.classList.add('selected'); selectedColor = e.target.dataset.color; if (capturedPhotos.length > 0 && !collageCanvas.classList.contains('hidden')) { createCollage(); } } });
            frameSelection.addEventListener('click', (e) => { const frameEl = e.target.closest('.frame-option'); if (frameEl) { frameSelection.querySelectorAll('.frame-option').forEach(el => el.classList.remove('selected')); frameEl.classList.add('selected'); selectedFrameUrl = frameEl.dataset.frameUrl; if (capturedPhotos.length > 0 && !collageCanvas.classList.contains('hidden')) { createCollage(); } } });
            photoCountSelect.addEventListener('change', loadFrames); collageLayoutSelect.addEventListener('change', loadFrames);
            startBtn.addEventListener('click', startPhotobooth);
            downloadBtn.addEventListener('click', downloadCollage);
            resetBtn.addEventListener('click', () => resetToInitialState(false));
            poseSuggestionBtn.addEventListener('click', async () => { poseSuggestionBtn.disabled = true; poseSuggestionOutput.textContent = "AI sedang berpikir..."; const prompt = "Berikan 3 ide pose yang seru dan singkat untuk photobooth. Pisahkan dengan koma. Contoh: Tanda peace, Muka kaget, Tertawa lepas"; const suggestion = await callGemini(prompt); poseSuggestionOutput.textContent = suggestion; poseSuggestionBtn.disabled = false; });
            titleGenerationBtn.addEventListener('click', async () => { titleGenerationBtn.disabled = true; titleGenerationBtn.textContent = "Membuat..."; const prompt = "Buat satu judul photobooth yang singkat (2-4 kata), ceria, dan cocok untuk kenang-kenangan."; generatedTitle = await callGemini(prompt); await createCollage(); titleGenerationBtn.disabled = false; titleGenerationBtn.textContent = "✨ Buat Judul Otomatis"; });

            // Inisialisasi
            initCamera();
            loadFrames();
        });
    </script>
</body>
</html>
